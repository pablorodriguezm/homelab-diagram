# Inventario del diagrama: todo lo que aparece en la imagen sale de este fichero.
# VERSIÓN PÚBLICA REDACTADA: puertos externos, versiones y nombres personales ocultos.
# Los datos reales van en inventory.local.yaml (en .gitignore); si existe, build.py usa ese.
# build.py lo lee; la posición de las cajas está colocada a mano en build.py.

meta:
  title: "Mi homelab"
  title_redacted: "Mi homelab"
  date: "noviembre 2026"
  watermark: "homelab"
  domain: "example.com"              # dominio real (solo se ve con --unredacted)

redact:
  domain: false                     # uso privado: sin redactar
  domain_placeholder: "redacted.com"
  ssid_names: false

vlans:   # orden = orden de la tabla
  - {key: "1",   tag: "VLAN 1",  name: principal, subnet: "192.168.1.0/24",  color: "#58a6ff", note: "red de confianza · equipos, servidores, NAS"}
  - {key: "25",  tag: "VLAN 25", name: IoT,       subnet: "192.168.25.0/24", color: "#3fb950", note: "domótica y dispositivos inteligentes"}
  - {key: "50",  tag: "VLAN 50", name: invitados, subnet: "192.168.50.0/24", color: "#bc8cff", note: "solo internet · aislada del resto"}
  - {key: "vpn", tag: "WireGuard", name: VPN,     subnet: "10.99.0.0/24",    color: "#39c5cf", note: "servidor en ZimaOS"}
  - {key: "tp",  tag: "Teleport", name: VPN,      subnet: "192.168.2.0/24",  color: "#4fb0c6", note: "VPN de UniFi en el UCG Ultra"}
  - {key: "wan", tag: "DIGI",    name: WAN,       subnet: "IP pública",      color: "#f85149", note: "fibra FTTH · ONT de DIGI → puerto WAN del UCG"}

internet:
  speed: {down: "500 Mbit/s", up: "500 Mbit/s"}
  note: "fibra DIGI · simétrica"

remote:
  name: "Acceso remoto"
  note: "WireGuard (ZimaOS) + UniFi Teleport"

ont:
  name: "ONT"
  type: "fibra"
  model: "ONT de DIGI · FTTH"
  ip: "puente"
  os: "sin router del operador"

gateway:
  name: "UCG"
  type: "gateway"
  model: "UniFi Cloud Gateway Ultra"
  ip: "192.168.1.1"
  internal: unifi
  os: "UniFi Network"
  hw:
    - {icon: glyph-cpu, label: "CPU",     value: "4× Cortex-A53",  sub: "ARM · 1.5 GHz"}
    - {icon: glyph-ram, label: "MEMORIA", value: "3 GB",           sub: "controlador UniFi integrado"}
    - {icon: glyph-nic, label: "RED",     value: "4× 1G + 2.5G",   sub: "LAN · WAN"}
  services:
    - {icon: glyph-shield, name: "Firewall",     note: "por zonas · 3 redes"}
    - {icon: glyph-dhcp,   name: "DHCP",         note: "principal · IoT · invitados"}
    - {icon: pihole,       name: "DNS",          note: "→ Pi-hole en ZimaOS"}
    - {icon: glyph-block,  name: "Filtro de contenido", note: "bloqueo de anuncios"}
    - {icon: unifi,        name: "Teleport",     note: "VPN · 192.168.2.0/24"}
    - {icon: glyph-nic,    name: "Port forwards", note: "15 reglas · 13 activas"}
  # puertos: index 0-3 = LAN 1-4, 4 = WAN
  ports:
    - {name: "1", speed: "1G", to: "USW-Lite-16", tagged: ["25", "50"], untagged: "1"}
    - {name: "2", speed: "1G", to: "PLC", untagged: "1"}
    - {name: "3", to: "libre"}
    - {name: "4", to: "libre"}
    - {name: "WAN", speed: "1G", to: "ONT", untagged: "wan"}

plc:
  name: "PLC"
  type: "powerline"
  model: "par devolo hasta el sótano"
  ip: "192.168.1.218 / .155"
  os: "PLC-tesla-sotano + PLC-tesla"

basement:     # al otro lado del PLC
  name: "V2C Trydan"
  type: "cargador"
  model: "wallbox del garaje"
  ip: "192.168.1.227"
  os: "carga el Tesla Model Y Juniper"

switch:
  name: "USW-Lite-16-PoE"
  type: "switch"
  model: "UniFi Switch Lite 16 PoE · 8× PoE+"
  ip: "192.168.1.102"
  os: "gestionado por el UCG Ultra"
  # untagged = VLAN nativa, tagged = VLANs etiquetadas (trunk)
  ports:
    - {name: "1",  to: "libre"}
    - {name: "2",  to: "libre"}
    - {name: "3",  to: "HA",       untagged: "1", poe: true}
    - {name: "4",  to: "libre"}
    - {name: "5",  to: "U6 IW",    untagged: "1", tagged: ["25", "50"], poe: true}
    - {name: "6",  to: "Flex",     untagged: "1", tagged: ["25", "50"], poe: true}
    - {name: "7",  to: "Apple TV", untagged: "1"}
    - {name: "8",  to: "libre"}
    - {name: "9",  to: "DS1515+",  untagged: "1"}
    - {name: "10", to: "libre"}
    - {name: "11", to: "libre"}
    - {name: "12", to: "libre"}
    - {name: "13", to: "libre"}
    - {name: "14", to: "Shelly",   untagged: "1"}
    - {name: "15", to: "libre"}
    - {name: "16", to: "UCG",      untagged: "1", tagged: ["25", "50"]}

devices:
  ha:     {name: "Home Assistant", type: "domótica", model: "Raspberry Pi 4 Model B", os: "Home Assistant OS · Uptime Kuma", icons: [homeassistant], vlan: "1", ip: "192.168.1.202", internal: homeassistant}
  ap:     {name: "U6 Enterprise IW", type: "punto de acceso", model: "Wi-Fi 6E · 6 / 5 / 2.4 GHz", icons: [unifi], vlan: "1", trunk: true, ip: "192.168.1.245", os: "PoE desde el puerto 5"}
  flex:   {name: "USW Flex", type: "switch", model: "UniFi Switch Flex · 5× 1G", icons: [unifi], vlan: "1", trunk: true, ip: "192.168.1.221", os: "alimentado por PoE"}
  appletv: {name: "Apple TV", type: "salón", model: "Apple TV 4K", icons: [apple], vlan: "1", ip: "192.168.1.160", internal: Apple-TV-Salon, os: "tvOS"}
  shelly: {name: "Shelly Pro 3EM", type: "medidor", model: "consumo trifásico del cuadro", icons: [shelly], vlan: "1", ip: "192.168.1.31", os: "→ Home Assistant"}
  jetkvm: {name: "JetKVM", type: "IP-KVM", model: "JetKVM", icons: [jetkvm], vlan: "1", ip: "192.168.1.70", os: "consola del Alienware"}
  laptop: {name: "HP", type: "a ratos", model: "HP EliteDesk", icons: [hp], vlan: "1", ip: "192.168.1.69", internal: HP-ELITEDESK, os: "se conecta de vez en cuando"}

flex_ports:   # USW Flex: 1 = uplink (PoE in)
  - {name: "1", to: "Lite-16"}
  - {name: "2", to: "ZimaOS", untagged: "1"}
  - {name: "3", to: "JetKVM", untagged: "1"}
  - {name: "4", to: "HP", untagged: "1"}
  - {name: "5", to: "libre"}

ssids:
  - {name: "Casa", redacted: "Casa",      vlan: "1"}
  - {name: "IoT",             redacted: "IoT",       vlan: "25"}
  - {name: "invitados",       redacted: "Invitados", vlan: "50"}

port_forwards:   # externo → destino interno; disabled = regla desactivada
  - {port: "•••",  proto: "TCP/UDP", to: "Home Assistant", dest: "192.168.1.202:8123"}
  - {port: "•••",  proto: "TCP/UDP", to: "Uptime Kuma",    dest: "192.168.1.202:3001"}
  - {port: "•••",  proto: "TCP/UDP", to: "Pi-hole",        dest: "192.168.1.34:8800"}
  - {port: "•••",  proto: "TCP",     to: "Immich",         dest: "192.168.1.34:2283"}
  - {port: "•••",  proto: "TCP/UDP", to: "Karakeep",       dest: "192.168.1.34:14592"}
  - {port: "•••",  proto: "TCP/UDP", to: "FreshRSS",       dest: "192.168.1.34:8749"}
  - {port: "•••", proto: "TCP/UDP", to: "WireGuard",      dest: "192.168.1.34:51820"}
  - {port: "•••",   proto: "TCP/UDP", to: "Synology web",   dest: "192.168.1.44:443"}
  - {port: "•••",    proto: "TCP",     to: "SMTP",           dest: "192.168.1.44:25"}
  - {port: "•••",   proto: "TCP",     to: "SMTP SSL/TLS",   dest: "192.168.1.44:465"}
  - {port: "•••",   proto: "TCP",     to: "SMTP STARTTLS",  dest: "192.168.1.44:587"}
  - {port: "•••",   proto: "TCP",     to: "IMAP SSL/TLS",   dest: "192.168.1.44:993"}
  - {port: "•••", proto: "TCP/UDP", to: "Plex",           dest: "192.168.1.45:32400"}
  - {port: "•••",    proto: "TCP/UDP", to: "Synology web",   dest: "192.168.1.44:80", disabled: true}
  - {port: "•••",  proto: "TCP/UDP", to: "WebDAV",         dest: "192.168.1.44:5006", disabled: true}
hosts:   # nombre corto de cada IP en la tarjeta de port forwards
  "192.168.1.202": "Home Assistant"
  "192.168.1.34": "ZimaOS"
  "192.168.1.44": "Synology"
  "192.168.1.45": "Synology"

server:
  name: "ZimaOS"
  type: "servidor"
  model: "Dell Alienware Aurora R5"
  os: "ZimaOS · Docker"
  ip: "192.168.1.34"
  internal: zimaos
  hw:
    - {icon: glyph-cpu, label: "CPU",     value: "Core i7-6700",       sub: "4 núcleos · 8 hilos · 4.0 GHz"}
    - {icon: glyph-ram, label: "MEMORIA", value: "16 GB DDR4",         sub: "4 módulos · 2400 MT/s"}
    - {icon: glyph-gpu, label: "GPU",     value: "Intel HD Graphics 530", sub: "integrada"}
    - {icon: glyph-nic, label: "RED",     value: "1G onboard",         sub: "→ USW Flex puerto 2"}
    - {icon: glyph-ssd, label: "SSD",     value: "Crucial SATA SSD",   sub: "459 GB · 375 usados · sistema + apps"}
  # contenedores Docker agrupados; un stack de compose = una tarjeta con una fila por contenedor
  groups:
    - name: "Red y gestión"
      apps:
        - {name: "Pi-hole",   icons: [pihole],    note: "DNS + bloqueo de anuncios", tag: "pihole"}
        - {name: "WireGuard", icons: [wireguard], note: "VPN · 10.99.0.0/24",        tag: ":51820"}
        - {name: "Portainer", icons: [portainer], note: "gestión de Docker",         tag: "portainer"}
    - name: "Casa"
      apps:
        - {name: "panel-cocina", icons: [glyph-panel],  note: "panel de la cocina", tag: "custom"}
        - {name: "Wallos",       icons: [glyph-wallet], note: "suscripciones y gastos", tag: "big-bear-wallos"}
    - name: "Fotos"
      apps:
        - name: "Immich"
          note: "biblioteca de fotos"
          tag: "4 contenedores"
          docker: true
          rows:
            - {icon: immich,  name: "server",           note: "web + API"}
            - {icon: immich,  name: "machine-learning", note: "caras y búsqueda"}
            - {icon: postgres, name: "postgres",        note: "base de datos"}
            - {icon: redis,   name: "redis",            note: "caché"}
    - name: "Documentos"
      apps:
        - {name: "BentoPDF", icons: [bentopdf], note: "herramientas PDF", tag: "bentopdf"}
    - name: "Tesla"
      apps:
        - name: "TeslaMate"
          note: "registro de viajes y cargas"
          tag: "5 contenedores"
          docker: true
          rows:
            - {icon: teslamate, name: "teslamate", note: "logger"}
            - {icon: postgres,  name: "db",        note: "base de datos"}
            - {icon: grafana,   name: "grafana",   note: "paneles"}
            - {icon: mosquitto, name: "mosquitto", note: "MQTT"}
            - {icon: teslamate, name: "api",       note: "API REST"}
    - name: "Lectura y notas"
      apps:
        - {name: "FreshRSS", icons: [freshrss], note: "lector RSS", tag: "freshrss"}
        - name: "Karakeep"
          note: "marcadores y lectura"
          tag: "3 contenedores"
          docker: true
          rows:
            - {icon: karakeep,    name: "karakeep",    note: "app"}
            - {icon: meilisearch, name: "meilisearch", note: "búsqueda"}
            - {icon: chrome,      name: "chrome",      note: "captura de páginas"}
        - name: "Outline"
          note: "wiki y notas"
          tag: "3 contenedores"
          docker: true
          rows:
            - {icon: outline-l, name: "outline",  note: "app"}
            - {icon: postgres,  name: "postgres", note: "base de datos"}
            - {icon: redis,     name: "redis",    note: "caché"}

nas:
  name: "DS1515+"
  type: "NAS"
  model: "Synology DiskStation DS1515+"
  os: "DSM 7"
  ip: "192.168.1.44 / .45 / .46"
  internal: synology
  hw:
    - {icon: glyph-cpu, label: "CPU",     value: "Atom C2538", sub: "4 núcleos · 2.4 GHz"}
    - {icon: glyph-ram, label: "MEMORIA", value: "16 GB",      sub: "DDR3 · ampliada"}
    - {icon: glyph-nic, label: "RED",     value: "4× 1G",      sub: "1 conectado"}
    - {icon: glyph-ups, label: "SAI",     value: "APC BX500MI", sub: "Back-UPS · USB"}
  enclosures:   # bays drawn left to right; disks in pools are "<enclosure>:<bay>"
    - {name: "DS1515+", bays: 5}
    - {name: "DX513", bays: 5, link: "eSATA"}
  pools:
    - name: "Volumen 1"
      layout: "Storage Pool 1 · SHR-1 · btrfs"
      disks: ["DS1515+:1", "DS1515+:2", "DS1515+:3"]
      used: "1,99 TB libres de 8,72 TB"
      pct: 77.15
      sub: "1 disco puede fallar"
      color: "#58a6ff"
    - name: "Volumen 2"
      layout: "RAID Linear"
      disks: ["DS1515+:4", "DS1515+:5", "DX513:1", "DX513:2"]
      used: "344 GB libres de 20,93 TB"
      pct: 98.40
      sub: "sin redundancia · si falla un disco se pierde el volumen"
      color: "#e3b341"
      warn: "ADVERTENCIA"
  services:
    - {icon: plex,         name: "Plex",    note: "32400 · en la .45"}
    - {icon: glyph-dhcp,   name: "Correo",  note: "SMTP + IMAP"}
    - {icon: synology,     name: "Web",     note: "443 · 80 off"}
    - {icon: glyph-block,  name: "WebDAV",  note: "5006 · off"}

clients:   # tarjeta "Clientes" (del export DHCP de UniFi; sin equipos de red ni servidores)
  - vlan: "1"
    rows:
      - {label: "Domótica",   items: ["Hue Bridge", "3× Netatmo", "Aqara G2H Pro", "Shelly H&T G3", "Shelly 1L"]}
      - {label: "Audio",      items: ["Sonos Salón", "HomePod mini", "2× Echo Dot"]}
      - {label: "Personales", items: ["3× iPhone", "2× iPad", "Redmi Pad", "Galaxy A56", "Apple Watch", "Quest 3"]}
      - {label: "Coche",      items: ["Tesla Model Y"]}
  - vlan: "25"
    rows:
      - {label: "Shelly",     items: ["2× 1PM Mini G3", "2× 1 Mini G3"]}
      - {label: "Cocina",     items: ["lavavajillas Bosch", "horno Bosch", "enchufe Meross"]}
      - {label: "Audio y TV", items: ["Samsung TV", "Sonos Habitación", "2× Echo Dot"]}
      - {label: "Cámara",     items: ["Indoorcam"]}
  - vlan: "50"
    rows:
      - {label: "", items: ["ningún cliente ahora mismo"]}
